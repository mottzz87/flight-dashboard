# flight-dashboard 用 Nginx 静态托管
# 用法：把下面这段加到 /etc/nginx/sites-enabled/ops 的 443 server 块内
# （与 location /flights/ 并列），注意把 alias 路径换成 DEPLOY_DIR 的实际值，
# 然后 nginx -t && systemctl reload nginx

location /dashboard/ {
    alias /home/admin/apps/ops-tools/flight-dashboard/;
    index index.html;
    expires 5m;
    add_header Cache-Control "public";
}
