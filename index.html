<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>东京 ⇄ 成都机票</title>
<meta name="description" content="东京往返成都机票价格监控看板">
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.classList.add('anim');</script>
<script defer src="https://cdn.jsdelivr.net/npm/motion@12/dist/motion.js"></script>
</head>
<body>
<div class="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i></div>

<nav class="nav reveal">
  <div class="nav-inner">
    <span class="nav-title">东京 <span class="swap">⇄</span> 成都</span>
    <span class="nav-status" id="nav-status"><span class="dot"></span><span id="updated-text">加载中…</span></span>
  </div>
</nav>

<header class="hero">
  <p class="eyebrow reveal">往返机票监控 · 每 3 小时更新</p>
  <p class="hero-combo reveal" id="hero-combo">—</p>
  <h1 class="hero-price reveal" id="hero-price">¥—</h1>
  <div class="hero-delta reveal" id="hero-delta"></div>
  <p class="hero-sub reveal" id="hero-sub"></p>
  <div class="segmented reveal" id="combos" role="tablist" aria-label="日期组合">
    <span class="seg-indicator" id="seg-ind"></span>
  </div>
</header>

<main class="wrap">
  <section class="bento" id="bento" aria-label="行程明细">
    <div class="loading">正在加载价格数据…</div>
  </section>

  <section class="sec reveal-scroll">
    <div class="sec-head"><h2>价格走势</h2><p>每日最低价 · 日元</p></div>
    <div class="chart-card">
      <div class="chart-wrap"><canvas id="chart"></canvas></div>
      <div class="chart-empty" id="chart-empty" hidden>暂无历史数据</div>
    </div>
  </section>

  <section class="sec reveal-scroll">
    <div class="sec-head"><h2>每日汇总</h2><p>每天最低价 / 直飞最低价各一条</p></div>
    <div class="hlist" id="history"><div class="loading">加载中…</div></div>
    <div class="pager" id="pager" hidden>
      <button class="pg-btn" id="pg-prev">‹ 上一页</button>
      <span class="pg-info" id="pg-info">1 / 1</span>
      <button class="pg-btn" id="pg-next">下一页 ›</button>
    </div>
  </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
